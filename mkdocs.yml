site_name: Asif's Security Notes
site_description: Cybersecurity, penetration testing, red teaming and vulnerability research notes
site_author: Asif Nawaz Minhas
site_url: https://notes.asifnawazminhas.com/

repo_name: asifnawazminhas/security-notes
repo_url: https://github.com/asifnawazminhas/security-notes

copyright: Copyright &copy; Asif Nawaz Minhas


# ============================================================
# THEME
# ============================================================

theme:
  name: material

  logo: assets/logo.png
  favicon: assets/favicon.png

  icon:
    repo: fontawesome/brands/github

  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.expand
    - navigation.path
    - navigation.indexes
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate

  palette:

    # Dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

    # Light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: cyan
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode


