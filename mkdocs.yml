# ============================================================

# THEME

# ============================================================

theme:
name: material

logo: assets/logo.png
favicon: assets/favicon.png

icon:
repo: fontawesome/brands/github

features:
- navigation.instant
- navigation.instant.progress
- navigation.tracking
- navigation.tabs
- navigation.tabs.sticky
- navigation.sections
- navigation.expand
- navigation.path
- navigation.indexes
- navigation.top
- toc.follow
- search.suggest
- search.highlight
- search.share
- content.code.copy
- content.code.annotate

palette:

```
# Dark mode
- media: "(prefers-color-scheme: dark)"
  scheme: slate
  primary: black
  accent: cyan
  toggle:
    icon: material/brightness-4
    name: Switch to light mode

# Light mode
- media: "(prefers-color-scheme: light)"
  scheme: default
  primary: black
  accent: cyan
  toggle:
    icon: material/brightness-7
    name: Switch to dark mode
```

